name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 21 세팅
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Gradle 캐시 (빌드 속도 향상)
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. 빌드 (테스트 제외 - DB 없는 환경)
      - name: Build with Gradle
        run: ./gradlew bootJar -x test

      # 5. EC2에 SSH로 jar 전송 + 재시작
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 기존 프로세스 종료
            PID=$(lsof -t -i:8080) && kill -9 $PID || true

            # 기존 jar 삭제
            rm -f /home/ubuntu/veganing-*.jar

      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/veganing-*.jar"
          target: "/home/ubuntu/"
          strip_components: 2

      - name: Start application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            nohup java \
              -Duser.timezone=Asia/Seoul \
              -jar /home/ubuntu/veganing-*.jar \
              --spring.profiles.active=prod \
              --spring.config.additional-location=file:/home/ubuntu/application-prod.yaml \
              > /home/ubuntu/app.log 2>&1 &

            echo "배포 완료"
