services:

  postgres:
    image: postgres:16          # 공식 이미지 (클래스)
    container_name: veganing-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"       # 호스트:컨테이너
    volumes:
      - postgres-data:/var/lib/postgresql/data  # 데이터 영구 보존
    restart: unless-stopped

  redis:
    image: redis:7              # 공식 이미지 (클래스)
    container_name: veganing-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data        # 데이터 영구 보존
    restart: unless-stopped

volumes:
  postgres-data:    # 볼륨 선언 (static 변수)
  redis-data: